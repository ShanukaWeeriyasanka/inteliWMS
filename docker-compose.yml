services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16.15
    container_name: intelliwms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intelliwms
      POSTGRES_USER: intelliwms_user
      POSTGRES_PASSWORD: intelliwms_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliwms_user -d intelliwms"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: intelliwms_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI + Uvicorn) ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: intelliwms_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env DATABASE_URL with the containerised postgres
      DATABASE_URL: postgresql://intelliwms_user:intelliwms_pass@postgres:5432/intelliwms
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── One-off DB seeder (exits after seeding) ──────────────────────────────
  seeder:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: intelliwms_seeder
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://intelliwms_user:intelliwms_pass@postgres:5432/intelliwms
    command: python scripts/seed_database.py
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Frontend (React built → served via nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: intelliwms_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
