services:
  postgres:
    image: postgres:16.15
    container_name: intelliwms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intelliwms
      POSTGRES_USER: intelliwms_user
      POSTGRES_PASSWORD: intelliwms_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: intelliwms_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
