services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16.15
    container_name: intelliwms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intelliwms
      POSTGRES_USER: intelliwms_user
      POSTGRES_PASSWORD: intelliwms_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliwms_user -d intelliwms"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: intelliwms_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # This minimal Chroma image has neither curl nor Python. The v2 heartbeat
      # is verified from the host; this check confirms the container is alive.
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI + Uvicorn) ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: intelliwms_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env DATABASE_URL with the containerised postgres
      DATABASE_URL: postgresql://intelliwms_user:intelliwms_pass@postgres:5432/intelliwms
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Optional: standalone inventory MCP server (streamable HTTP) ──────────
  # Off by default — the backend runs the same server in-process (INVENTORY_MCP_TRANSPORT=memory).
  # To use it: `docker compose --profile mcp-http up -d` and give the backend
  #   INVENTORY_MCP_TRANSPORT=streamable_http, INVENTORY_MCP_URL=http://inventory-mcp:8003/mcp
  # and the same INVENTORY_MCP_TOKEN (set in .env; the server refuses to start without it).
  inventory-mcp:
    profiles: ["mcp-http"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: intelliwms_inventory_mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://intelliwms_user:intelliwms_pass@postgres:5432/intelliwms
      INVENTORY_MCP_ALLOWED_HOSTS: "inventory-mcp:*,localhost:*,127.0.0.1:*"
    command: python -m mcp_servers.inventory_mcp_server --transport streamable-http --host 0.0.0.0 --port 8003
    expose:
      - "8003"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── One-off DB seeder (exits after seeding) ──────────────────────────────
  seeder:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: intelliwms_seeder
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://intelliwms_user:intelliwms_pass@postgres:5432/intelliwms
    command: python scripts/seed_database.py
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Frontend (React built → served via nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: intelliwms_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
